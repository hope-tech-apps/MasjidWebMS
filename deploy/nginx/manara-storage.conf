# /etc/nginx/snippets/manara-storage.conf
#
# Uploaded files are data, never a page of this site.
#
# Everything under /storage is a file an organisation uploaded, answered from the same origin as
# the admin screen. The application refuses a name that is not what it claims to be; this is the
# second lock, for the name nobody thought of: whatever a file is called, the web server answers
# it inline ONLY IF it is a kind that cannot be a page.
#
#   - pictures, PDFs, video and audio: typed and answered exactly as before;
#   - SVG: still an image (the apps and the website draw it through <img>), but opened by itself
#     it is sandboxed and runs no script;
#   - anything else (.html, .xhtml, .xml, .js, a name with no ending, an ending not listed
#     below): a download, typed application/octet-stream.
#
# A NEW KIND OF UPLOAD THAT MUST OPEN IN THE BROWSER has to be added to the list below, on every
# server, or it downloads instead. That is the safe way to be wrong.
#
# `^~` stops the server block's regex locations from applying under /storage, so the two that
# matter are restated here: a dot file is refused, and nothing under /storage is ever run as PHP
# (this block has no fastcgi, so a .php file would be a download).
#
# Included inside the :443 server block of every vhost that serves the application's public/
# directory. Source of truth: deploy/nginx/manara-storage.conf in the repository.
location ^~ /storage/ {
    types { }
    default_type application/octet-stream;
    # No `always` on this one: it belongs on a file that is answered, not on a refusal's own page.
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.php?$query_string;

    location ~ /\. { deny all; }

    location ~* \.(?:jpe?g|png|gif|webp|bmp|ico|avif|pdf|mp4|m4v|mov|webm|mp3|m4a|wav|ogg)$ {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php?$query_string;
    }

    location ~* \.svgz?$ {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
        try_files $uri /index.php?$query_string;
    }
}
