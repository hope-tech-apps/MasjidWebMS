; PHP reads this PER-DIRECTORY file and it OVERRIDES /etc/php/*/fpm/php.ini, so it —
; not the server's ini — is the real upload ceiling. It ships with the code, which is
; why raising the server's php.ini alone silently changed nothing (2026-09-24: a 60 MB
; video was refused 413 while php.ini said 100M).
;
; Sized for the largest LEGAL request: the videos of one post (up to three, 120 MB
; together: config/groups.php media.video.max_total_kb; one may be the full 100 MB)
; plus eight 8 MB images plus fields. UploadCeilingTest fails the build if these
; drop below what config/groups.php promises.
upload_max_filesize = 100M
post_max_size = 192M
memory_limit = 512M
max_execution_time = 120
